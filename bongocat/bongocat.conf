# Wayland Bongo Cat Configuration
# Generated by bongocat-find-devices

# Visual settings
cat_height=50                    # Size of bongo cat (16-128)
cat_x_offset=160                   # Horizontal position offset
cat_y_offset=-2                  # Vertical position offset
overlay_opacity=0              # Background opacity (0-255)

# Animation settings
fps=24                           # Frame rate (1-120)
keypress_duration=100            # Animation duration (ms)
test_animation_interval=0       # Test animation every N seconds (0=off)

# Input devices
keyboard_device=/dev/input/event1   # Power Button
keyboard_device=/dev/input/event2   # Power Button
keyboard_device=/dev/input/event3   # AT Translated Set 2 keyboard
keyboard_device=/dev/input/event4 
keyboard_device=/dev/input/event5   # Video Bus
keyboard_device=/dev/input/event6   # CASUE USB KB
keyboard_device=/dev/input/event7   # CASUE USB KB Consumer Control
keyboard_device=/dev/input/event8   # CASUE USB KB System Control
keyboard_device=/dev/input/event9   # CASUE USB KB Keyboard
keyboard_device=/dev/input/event10   # PC Speaker
keyboard_device=/dev/input/event13   # Asus WMI hotkeys

# Debug
enable_debug=0                   # Show debug messages

